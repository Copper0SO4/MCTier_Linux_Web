<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src https://uop.quark.cn; base-uri 'none'; form-action 'none'">
  <title>夸克手机号登录</title>
  <!-- Android WebView inside a scrolling Compose dialog measures its document
       with wrap_content. Percentage heights can therefore resolve to zero even
       when the native view is 240 dp tall. Give the form an explicit CSS height. -->
  <style>html,body{margin:0;background:white;min-height:240px}iframe{display:block;width:100%;height:240px;border:0}</style>
</head>
<body>
  <iframe id="login" title="夸克手机号验证码登录" sandbox="allow-scripts allow-forms allow-same-origin" referrerpolicy="no-referrer"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('login');
      let channel = null;
      let ticket = null;
      const deliver = () => {
        if (channel && ticket) {
          channel.postMessage(ticket);
          ticket = null;
        }
      };
      window.addEventListener('message', event => {
        // Only native code can supply the first channel to this local top-level document.
        if (event.source === null && event.data === 'quark-login-channel' && event.ports.length === 1 && !channel) {
          channel = event.ports[0];
          deliver();
          return;
        }
        if (event.origin !== 'https://uop.quark.cn' || event.source !== frame.contentWindow ||
            typeof event.data !== 'string' || event.data.length !== 32 || !/^[A-Za-z0-9]{32}$/.test(event.data)) return;
        ticket = event.data;
        deliver();
      });
      frame.src = 'https://uop.quark.cn/cas/custom/login?custom_login_type=mobile&client_id=532&display=pc';
    })();
  </script>
</body>
</html>
