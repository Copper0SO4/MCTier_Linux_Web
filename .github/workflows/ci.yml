name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend (includes TypeScript check)
        run: npm run build
      - name: Run regression tests
        run: npm test
      # Report existing lint debt separately; a successful job is not a clean lint report.
      - name: Report existing lint debt (non-blocking)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Summarize coverage
        if: always()
        shell: pwsh
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          "Frontend CI checks build/typecheck and Node regression tests. Lint outcome: $env:LINT_OUTCOME (non-blocking existing debt)." >> $env:GITHUB_STEP_SUMMARY
          "Native Windows/Linux, Android, real media and EasyTier tests require the separate local validation documented in README.md. This workflow does not package or publish applications." >> $env:GITHUB_STEP_SUMMARY
