[package]
name = "mctier-linux-web"
version = "3.9.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors"] }
bytes = "1"
dashmap = "6"
# Upstream folder server writes Deflated ZIPs only; avoid unrelated native codecs.
zip = { version = "2", default-features = false, features = ["deflate-miniz"] }
parking_lot = "0.12"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
dirs = "5"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
proptest = "1"

[profile.release]
strip = true
